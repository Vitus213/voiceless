<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voiceless · 夜声档案</title>
<style>
:root {
  --ink: #0C1120;
  --slate: #16203A;
  --slate-edge: #23314F;
  --moon: #DCE4F5;
  --haze: #7C8BAD;
  --gold: #F0C96C;
  --radius: 10px;
  --serif: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
  --sans: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0;
  background:
    radial-gradient(1100px 500px at 85% -10%, #1B2A4D 0%, transparent 60%),
    radial-gradient(700px 400px at -10% 8%, #14203C 0%, transparent 55%),
    var(--ink);
  color: var(--moon);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 96px; }

/* ---------- masthead ---------- */
.masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
.wordmark { display: flex; align-items: baseline; gap: 14px; }
.moon-mark {
  font-family: var(--serif);
  font-size: 34px;
  color: var(--gold);
  text-shadow: 0 0 18px rgba(240, 201, 108, 0.35);
  transform: translateY(4px);
}
.wordmark h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 30px;
  letter-spacing: 0.04em;
}
.wordmark .sub {
  font-family: var(--serif);
  color: var(--haze);
  font-size: 15px;
  letter-spacing: 0.28em;
}
.totals {
  display: flex;
  gap: 26px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--haze);
  font-variant-numeric: tabular-nums;
}
.totals b { display: block; font-size: 22px; font-weight: 600; color: var(--moon); }

/* ---------- day groups ---------- */
.day { margin-top: 30px; }
.day > .label {
  display: flex;
  align-items: baseline;
  gap: 12px;
  font-family: var(--serif);
  font-size: 17px;
  color: var(--haze);
  margin-bottom: 10px;
}
.day > .label .weekday { font-size: 12px; letter-spacing: 0.2em; color: #4A5B80; }

/* ---------- record rows ---------- */
.record {
  background: var(--slate);
  border: 1px solid var(--slate-edge);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color 0.25s ease;
}
.record.playing { border-color: rgba(240,201,108,0.55); }
.row {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  cursor: pointer;
}
.row:focus-visible, button:focus-visible, input:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.play {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--slate-edge);
  background: transparent;
  color: var(--moon);
  font-size: 14px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}
.play:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.play[disabled] { color: #3D4B6B; border-color: #1E2A45; cursor: default; }
.record.playing .play { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.main { min-width: 0; }
.text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 15.5px;
}
.wave-line { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
canvas.wave { height: 22px; flex: 1; max-width: 380px; display: block; }
.meta { display: flex; align-items: baseline; gap: 12px; font-family: var(--mono); font-size: 12px; color: var(--haze); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip {
  border: 1px solid var(--slate-edge);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 11px;
  color: var(--haze);
}
.chip.audio-off { color: #55628A; border-style: dashed; }

/* ---------- expanded panel ---------- */
.expand {
  display: none;
  border-top: 1px solid #1D2946;
  padding: 16px 18px 18px 70px;
  background: linear-gradient(180deg, rgba(12, 17, 32, 0.35), transparent 70%);
}
.record.open .expand { display: block; }
canvas.wave-big { height: 64px; width: 100%; display: block; border-radius: 6px; }
.player-line { display: flex; align-items: center; gap: 14px; margin-top: 12px; font-family: var(--mono); font-size: 13px; color: var(--haze); font-variant-numeric: tabular-nums; }
.player-line input[type="range"] {
  flex: 1;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: #2A3A5E;
  cursor: pointer;
}
.player-line input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--gold);
}
.player-line input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px;
  border: none;
  border-radius: 50%;
  background: var(--gold);
}
.final-text { margin-top: 14px; font-size: 16px; line-height: 1.75; white-space: pre-wrap; }
.raw-text { margin-top: 10px; font-size: 13px; color: var(--haze); white-space: pre-wrap; }
.raw-text::before { content: "识别原文 · "; font-size: 11px; letter-spacing: 0.18em; color: #4A5B80; }

/* ---------- footer states ---------- */
.status { text-align: center; margin-top: 34px; color: var(--haze); font-size: 14px; }
.status button {
  background: transparent;
  border: 1px solid var(--slate-edge);
  color: var(--moon);
  border-radius: 999px;
  padding: 8px 22px;
  font-size: 14px;
  cursor: pointer;
  font-family: var(--sans);
}
.status button:hover { border-color: var(--gold); color: var(--gold); }
.empty { text-align: center; margin-top: 90px; color: var(--haze); }
.empty .big { font-family: var(--serif); font-size: 22px; color: var(--moon); margin-bottom: 8px; }
.empty code {
  font-family: var(--mono);
  font-size: 13px;
  background: var(--slate);
  border: 1px solid var(--slate-edge);
  border-radius: 6px;
  padding: 2px 8px;
}
.error { color: #E39A8B; }

@media (max-width: 640px) {
  .masthead { flex-direction: column; align-items: flex-start; gap: 14px; }
  .row { grid-template-columns: 44px 1fr; }
  .meta { display: none; }
  .expand { padding-left: 18px; }
}
@media (min-width: 641px) {
  .meta-short { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
/* ---------- prompt editor ---------- */
.prompt-editor {
  background: var(--slate);
  border: 1px solid var(--slate-edge);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 30px;
}
.prompt-editor h2 {
  margin: 0 0 4px;
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.prompt-editor .hint { color: var(--haze); font-size: 13px; margin-bottom: 12px; }
.prompt-editor .hint code {
  font-family: var(--mono);
  color: var(--gold);
}
.prompt-editor textarea {
  width: 100%;
  background: var(--ink);
  border: 1px solid var(--slate-edge);
  border-radius: 8px;
  color: var(--moon);
  font-family: var(--mono);
  font-size: 13.5px;
  line-height: 1.5;
  padding: 12px 14px;
  resize: vertical;
  min-height: 120px;
}
.prompt-editor textarea:focus { outline: 2px solid var(--gold); outline-offset: 2px; }
.prompt-actions { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.save-btn {
  background: var(--gold);
  color: var(--ink);
  border: none;
  border-radius: 8px;
  padding: 8px 18px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.save-btn:hover { filter: brightness(1.08); }
.prompt-status { color: var(--haze); font-size: 13px; }
.prompt-status.ok { color: #2EC27E; }
.prompt-status.err { color: #F28B82; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="wordmark">
      <span class="moon-mark">☾</span>
      <div>
        <h1>Voiceless</h1>
        <div class="sub">夜声档案 · HISTORY</div>
      </div>
    </div>
    <div class="totals" id="totals"></div>
  </header>

  <section class="prompt-editor">
    <h2>转写提示词</h2>
    <div class="hint">整理提示词模板，<code>{text}</code> 会被替换为转写正文；保存后下次语音输入立即生效。</div>
    <textarea id="promptInput" rows="6" spellcheck="false"></textarea>
    <div class="prompt-actions">
      <button class="save-btn" id="promptSave">保存</button>
      <span class="prompt-status" id="promptStatus"></span>
    </div>
  </section>

  <main id="feed"></main>

  <div class="status" id="status"></div>
</div>

<script>
"use strict";

const feed = document.getElementById("feed");
const statusEl = document.getElementById("status");
const totalsEl = document.getElementById("totals");

let cursor = null;
let loading = false;
let exhausted = false;
let activeAudio = null; // { article, audio, record }
const waveformCache = new Map(); // id -> Float32Array peaks

const dateFmt = new Intl.DateTimeFormat("zh-CN", { month: "long", day: "numeric" });
const weekdayFmt = new Intl.DateTimeFormat("zh-CN", { weekday: "short" });
const timeFmt = new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });

function esc(text) {
  const div = document.createElement("div");
  div.textContent = text ?? "";
  return div.innerHTML;
}

function fmtDuration(seconds) {
  if (seconds == null || isNaN(seconds)) return "–:––";
  const s = Math.round(seconds);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

async function loadTotals() {
  try {
    const res = await fetch("/api/totals");
    if (!res.ok) return;
    const totals = await res.json();
    totalsEl.innerHTML =
      `<div><b>${totals.records}</b>条记录</div>` +
      `<div><b>${totals.characters.toLocaleString("zh-CN")}</b>字</div>` +
      `<div><b>${fmtDuration(totals.duration_seconds)}</b>语音时长</div>`;
  } catch { /* totals are decorative; ignore */ }
}

function dayGroup(label, iso) {
  let group = document.querySelector(`[data-day="${CSS.escape(label)}"]`);
  if (group) return group;
  group = document.createElement("section");
  group.className = "day";
  group.dataset.day = label;
  const weekday = weekdayFmt.format(new Date(iso));
  group.innerHTML = `<div class="label">${esc(label)} <span class="weekday">${esc(weekday)}</span></div>`;
  // Records arrive newest-first, so a day group is always complete before
  // any older day begins: append new groups at the end of the feed.
  feed.appendChild(group);
  return group;
}

function backendLabel(provider) {
  if (provider === "cloud-realtime") return "云端";
  if (provider === "local-streaming") return "本地";
  return provider || "未知";
}

function recordRow(record) {
  const group = dayGroup(
    dateFmt.format(new Date(record.created_at)),
    record.created_at
  );
  const hasAudio = Boolean(record.audio_path);
  const article = document.createElement("article");
  article.className = "record";
  article.dataset.id = record.id;

  const time = timeFmt.format(new Date(record.created_at));
  const processed = record.processed_text && record.processed_text !== record.final_text;

  article.innerHTML = `
    <div class="row" tabindex="0" role="button" aria-label="${hasAudio ? "播放" : "查看"}记录">
      <button class="play" ${hasAudio ? "" : "disabled"} aria-label="播放">▶</button>
      <div class="main">
        <div class="text">${esc(record.final_text)}</div>
        <div class="wave-line">
          ${hasAudio ? `<canvas class="wave"></canvas>` : ""}
          <span class="meta-short">${esc(time)}</span>
        </div>
      </div>
      <div class="meta">
        <span>${esc(time)}</span>
        <span>${esc(fmtDuration(record.duration_seconds))}</span>
        <span class="chip">${esc(record.processing_mode || "quick")}</span>
        <span class="chip">${esc(backendLabel(record.asr_provider))}</span>
        ${hasAudio ? "" : `<span class="chip audio-off">无录音</span>`}
      </div>
    </div>
    <div class="expand">
      ${hasAudio ? `
        <canvas class="wave-big"></canvas>
        <div class="player-line">
          <span class="t-cur">0:00</span>
          <input type="range" min="0" max="1000" value="0" aria-label="播放进度">
          <span class="t-dur">${esc(fmtDuration(record.duration_seconds))}</span>
        </div>` : ""}
      <div class="final-text">${esc(record.final_text)}</div>
      ${processed ? `<div class="raw-text">${esc(record.raw_text)}</div>` : ""}
    </div>`;

  const row = article.querySelector(".row");
  row.addEventListener("click", (event) => {
    if (event.target.closest(".play")) return;
    article.classList.toggle("open");
  });
  row.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      article.classList.toggle("open");
    }
  });
  if (hasAudio) {
    article.querySelector(".play").addEventListener("click", () => togglePlay(article, record));
    drawWaveforms(article, record); // idle waveform from the real recording
  }
  group.appendChild(article);
}

async function togglePlay(article, record) {
  if (activeAudio && activeAudio.article === article) {
    pauseActive();
    return;
  }
  pauseActive();
  const audio = new Audio(`/api/audio/${record.id}.wav`);
  activeAudio = { article, audio, record };
  article.classList.add("open", "playing");
  const button = article.querySelector(".play");
  button.textContent = "⏸";
  button.setAttribute("aria-label", "暂停");

  audio.addEventListener("ended", () => stopActive());
  audio.addEventListener("timeupdate", () => updateProgress());
  audio.play().catch(() => stopActive());

  drawWaveforms(article, record);
}

function pauseActive() {
  if (!activeAudio) return;
  activeAudio.audio.pause();
  const { article } = activeAudio;
  article.classList.remove("playing");
  const button = article.querySelector(".play");
  button.textContent = "▶";
  button.setAttribute("aria-label", "播放");
}

function stopActive() {
  if (!activeAudio) return;
  const { article, audio } = activeAudio;
  audio.pause();
  audio.src = "";
  article.classList.remove("playing");
  const button = article.querySelector(".play");
  button.textContent = "▶";
  button.setAttribute("aria-label", "播放");
  activeAudio = null;
}

function updateProgress() {
  if (!activeAudio) return;
  const { article, audio } = activeAudio;
  const slider = article.querySelector('input[type="range"]');
  const current = article.querySelector(".t-cur");
  const total = article.querySelector(".t-dur");
  if (audio.duration && isFinite(audio.duration)) {
    slider.value = Math.round((audio.currentTime / audio.duration) * 1000);
    total.textContent = fmtDuration(audio.duration);
  }
  current.textContent = fmtDuration(audio.currentTime);
  drawWaveforms(article, activeAudio.record, audio.currentTime, audio.duration || 0);
}

/* ---------- waveform rendering ---------- */

async function fetchPeaks(record) {
  if (waveformCache.has(record.id)) return waveformCache.get(record.id);
  const res = await fetch(`/api/audio/${record.id}.wav`);
  if (!res.ok) throw new Error(`audio ${res.status}`);
  const buffer = await res.arrayBuffer();
  const pcm = extractPcm16(buffer);
  if (!pcm || pcm.length === 0) throw new Error("no pcm data");
  const buckets = 900;
  const peaks = new Float32Array(buckets * 2);
  const perBucket = Math.max(1, Math.floor(pcm.length / buckets));
  for (let i = 0; i < buckets; i++) {
    let min = 0, max = 0;
    const start = i * perBucket;
    const end = Math.min(pcm.length, start + perBucket);
    for (let j = start; j < end; j++) {
      const v = pcm[j];
      if (v < min) min = v;
      if (v > max) max = v;
    }
    peaks[i * 2] = min;
    peaks[i * 2 + 1] = max;
  }
  waveformCache.set(record.id, peaks);
  return peaks;
}

/// Locate the PCM16 mono payload inside a WAV container (mirror of batch.rs).
function extractPcm16(buffer) {
  const view = new DataView(buffer);
  if (buffer.byteLength < 12) return null;
  const tag = (offset) => String.fromCharCode(...new Uint8Array(buffer, offset, 4));
  if (tag(0) !== "RIFF" || tag(8) !== "WAVE") return null;
  let offset = 12;
  while (offset + 8 <= buffer.byteLength) {
    const chunkId = tag(offset);
    const size = view.getUint32(offset + 4, true);
    if (chunkId === "data") {
      const start = offset + 8;
      const end = Math.min(buffer.byteLength, start + size);
      const samples = new Float32Array(Math.floor((end - start) / 2));
      for (let i = 0; i < samples.length; i++) {
        samples[i] = view.getInt16(start + i * 2, true) / 32768;
      }
      return samples;
    }
    offset += 8 + size + (size % 2);
  }
  return null;
}

function paintWave(canvas, peaks, progressRatio, active) {
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (width === 0 || height === 0) return;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, width, height);
  const mid = height / 2;
  const buckets = peaks.length / 2;
  const step = width / buckets;
  for (let i = 0; i < buckets; i++) {
    const x = i * step;
    const played = i / buckets <= progressRatio;
    ctx.strokeStyle = active
      ? (played ? "#F0C96C" : "rgba(220, 228, 245, 0.38)")
      : "rgba(220, 228, 245, 0.28)";
    ctx.lineWidth = Math.max(1, step * 0.55);
    const min = peaks[i * 2] * (mid - 1);
    const max = peaks[i * 2 + 1] * (mid - 1);
    ctx.beginPath();
    ctx.moveTo(x, mid + min);
    ctx.lineTo(x, mid + max || mid + min - 0.6);
    ctx.stroke();
  }
}

async function drawWaveforms(article, record, currentTime = 0, duration = 0) {
  let peaks;
  try {
    peaks = await fetchPeaks(record);
  } catch {
    return; // no waveform; playback itself still works
  }
  const active = Boolean(activeAudio && activeAudio.record.id === record.id);
  const ratio = duration > 0 ? currentTime / duration : 0;
  for (const canvas of article.querySelectorAll("canvas")) {
    if (canvas.clientWidth === 0) continue; // hidden
    paintWave(canvas, peaks, ratio, active);
  }
  const slider = article.querySelector('input[type="range"]');
  if (slider && !slider.dataset.wired) {
    slider.dataset.wired = "1";
    slider.addEventListener("input", () => {
      if (!activeAudio || activeAudio.record.id !== record.id) return;
      const audio = activeAudio.audio;
      if (audio.duration && isFinite(audio.duration)) {
        audio.currentTime = (slider.value / 1000) * audio.duration;
      }
    });
  }
}

/* ---------- pagination ---------- */

async function loadPage() {
  if (loading || exhausted) return;
  loading = true;
  statusEl.textContent = "正在读取记录…";
  try {
    const params = new URLSearchParams({ limit: "200" });
    if (cursor) params.set("cursor", cursor);
    const res = await fetch(`/api/records?${params}`);
    const body = await res.json();
    if (!res.ok || body.error) {
      throw new Error(body.error || `HTTP ${res.status}`);
    }
    if (body.records.length === 0 && !cursor) {
      feed.innerHTML = `<div class="empty">
        <div class="big">夜声档案还是空的</div>
        <div>在终端运行 <code>voiceless stream</code> 说点什么，记录会出现在这里。</div>
      </div>`;
      statusEl.textContent = "";
      exhausted = true;
      loading = false;
      return;
    }
    for (const record of body.records) recordRow(record);
    cursor = body.next_cursor;
    if (!body.next_cursor) {
      exhausted = true;
      statusEl.textContent = body.records.length ? "已经到最早的一条了" : "";
    } else {
      statusEl.innerHTML = `<button id="more">加载更早的记录</button>`;
      document.getElementById("more").addEventListener("click", loadPage);
    }
  } catch (error) {
    statusEl.innerHTML = `<span class="error">读取失败：${esc(error.message)}。稍后再试。</span>`;
  }
  loading = false;
}

/* ---------- prompt editor ---------- */
const promptInput = document.getElementById("promptInput");
const promptSave = document.getElementById("promptSave");
const promptStatus = document.getElementById("promptStatus");

async function loadPrompt() {
  try {
    const res = await fetch("/api/prompt");
    const body = await res.json();
    if (!res.ok || body.error) throw new Error(body.error || `HTTP ${res.status}`);
    promptInput.value = body.prompt || "";
  } catch (error) {
    promptStatus.textContent = `读取失败：${error.message}`;
    promptStatus.className = "prompt-status err";
  }
}

async function savePrompt() {
  promptStatus.textContent = "保存中…";
  promptStatus.className = "prompt-status";
  try {
    const res = await fetch("/api/prompt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: promptInput.value })
    });
    const body = await res.json();
    if (!res.ok || !body.ok) throw new Error(body.error || `HTTP ${res.status}`);
    promptStatus.textContent = "已保存 · 下次语音输入立即生效";
    promptStatus.className = "prompt-status ok";
  } catch (error) {
    promptStatus.textContent = `保存失败：${error.message}`;
    promptStatus.className = "prompt-status err";
  }
}

promptSave.addEventListener("click", savePrompt);
loadPrompt();

loadTotals();
loadPage();
</script>
</body>
</html>
