[package]
name = "voiceless"
version = "0.2.1"
edition = "2021"
description = "Fast realtime voice input for Linux"
license = "MIT"

[[bin]]
name = "voiceless"
path = "src/main.rs"

[features]
default = []
# transcribe.cpp engine for GGUF models (Qwen3-ASR 1.7B); `cuda` runs it on
# the GPU and needs cmake + nvcc (see flake.nix / build.rs).
transcribe = ["dep:transcribe-cpp"]
cuda = ["transcribe", "transcribe-cpp/cuda"]
# GPU through the system Vulkan driver (NVIDIA, AMD, Intel): needs the
# Vulkan headers, loader and `glslc` at build time, no CUDA toolkit.
vulkan = ["transcribe", "transcribe-cpp/vulkan"]

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
pinyin = { version = "0.10", default-features = false, features = ["plain"] }
regex = "1"
toml_edit = "0.22"
futures-util = "0.3"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
toml = "0.8"
sherpa-onnx = { version = "=1.13.3", default-features = false, features = ["shared"] }
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.4"
ureq = "2.12"
getrandom = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
unicode-normalization = "0.1.25"
transcribe-cpp = { version = "0.4.0", default-features = false, optional = true }
semver = "1"
tempfile = "3"
rhai = { version = "1.27", default-features = false, features = ["std", "no_module", "no_time", "no_float", "no_custom_syntax"] }

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.11"
evdev = { version = "0.13", features = ["tokio"] }
zbus = "5.19.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.17.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Registry", "Win32_System_StationsAndDesktops",
    "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
parking_lot = "0.12"
