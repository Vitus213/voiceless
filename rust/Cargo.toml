[package]
name = "voiceless"
version = "0.1.0"
edition = "2021"
description = "Fast realtime voice input for Linux"
license = "MIT"

[[bin]]
name = "voiceless"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
toml = "0.8"
sherpa-onnx = { version = "=1.13.3", default-features = false, features = ["shared"] }
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.4"
ureq = "2.12"
getrandom = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
zbus = "5.19.0"
unicode-normalization = "0.1.25"
ashpd = "0.11"

[dev-dependencies]
parking_lot = "0.12"
tempfile = "3"
