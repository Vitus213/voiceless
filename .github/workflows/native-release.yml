name: Native Linux release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Native Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Ubuntu 22.04 build tools and the pinned Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils cmake curl gcc g++-11 make patchelf pkg-config python3
          rustup toolchain install 1.99.1 --profile minimal
      - name: Build native and npm candidates
        run: python3 scripts/release/native.py "$RUNNER_TEMP/candidates"
      - name: Check payloads, ELF ABI, local recognition and Bun installation
        run: python3 -B scripts/release/validate.py "$RUNNER_TEMP/candidates"
      - name: Upload validated architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ matrix.arch }}
          path: ${{ runner.temp }}/candidates/*
          if-no-files-found: error
          compression-level: 0

  candidates:
    name: Assemble candidate artifacts
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-build-*
          path: builds
      - name: Collect the two native archives and three npm packages
        shell: bash
        run: |
          shopt -s failglob
          cmp builds/native-build-x86_64/voiceless-[0-9]*.tgz builds/native-build-aarch64/voiceless-[0-9]*.tgz
          mkdir -p candidates
          cp builds/native-build-x86_64/voiceless-[0-9]*.tgz candidates/
          for arch in x86_64 aarch64; do
            cp builds/native-build-"$arch"/voiceless-v*-linux-"$arch"-gnu.tar.gz candidates/
            cp builds/native-build-"$arch"/voiceless-linux-"$arch"-gnu-*.tgz candidates/
          done
      - name: Upload the complete release candidate set
        uses: actions/upload-artifact@v4
        with:
          name: voiceless-release-candidates
          path: candidates/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish to npm and GitHub Releases
    if: github.repository == 'Vitus213/voiceless' && github.event_name == 'push' && github.ref_type == 'tag'
    needs: candidates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: voiceless-public-release
      queue: max
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tagged commit from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
      - uses: actions/download-artifact@v4
        with:
          name: voiceless-release-candidates
          path: candidates
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish the validated candidates
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: python3 -B scripts/release/publish.py candidates "$GITHUB_REF_NAME"
