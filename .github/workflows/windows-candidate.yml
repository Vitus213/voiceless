name: Installed Windows meeting permission guidance

on:
  workflow_dispatch:
  push:
    branches: ['ci/windows-candidate/meeting-permission-guidance-0.2.0']

permissions:
  contents: read

jobs:
  installers:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the runner's desktop, audio endpoints and graphics adapter
        run: |
          $session = (Get-Process -Id $PID).SessionId
          $explorer = @(Get-Process -Name explorer -ErrorAction SilentlyContinue | Where-Object SessionId -eq $session)
          $endpoints = @(Get-CimInstance Win32_PnPEntity -Filter "PNPClass = 'AudioEndpoint'" | Where-Object Present)
          $graphics = @(Get-CimInstance Win32_VideoController)
          [ordered]@{
            session = $session
            explorer = $explorer.Count
            audioEndpoints = @($endpoints | ForEach-Object Name)
            graphics = @($graphics | ForEach-Object Name)
          } | ConvertTo-Json -Depth 3
      - name: Build candidates with the corrected startup message
        run: |
          rustup default 1.99.1-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/windows/package.py "$env:RUNNER_TEMP/candidates"
      - name: Record the tested core installer
        run: Get-FileHash "$env:RUNNER_TEMP/candidates/voiceless-core-*.exe" -Algorithm SHA256 | Format-List Hash,Path
      - uses: actions/upload-artifact@v4
        with:
          name: voiceless-windows-meeting-permission-core
          path: ${{ runner.temp }}/candidates/voiceless-core-*.exe
          if-no-files-found: error
          compression-level: 0
      - name: Set up two independent WASAPI endpoint pairs on the disposable guest
        run: ./scripts/release/windows/lines.ps1
      - name: Install the audio signal generator
        run: python -m pip install sounddevice==0.5.3
      - name: Verify the guest's WASAPI refusal and the absence of a recording on retry
        run: python -u -B scripts/release/windows/meeting.py --expect-wasapi-denial "$env:RUNNER_TEMP/candidates"
