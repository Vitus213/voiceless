name: Installed Windows desktop and history acceptance

on:
  workflow_dispatch:
  push:
    branches: ['ci/windows-candidate/desktop-reopen-0.2.0']

permissions:
  contents: read
  actions: read

jobs:
  installers:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the runner's desktop, audio endpoints and graphics adapter
        run: |
          $session = (Get-Process -Id $PID).SessionId
          $explorer = @(Get-Process -Name explorer -ErrorAction SilentlyContinue | Where-Object SessionId -eq $session)
          $endpoints = @(Get-CimInstance Win32_PnPEntity -Filter "PNPClass = 'AudioEndpoint'" | Where-Object Present)
          $graphics = @(Get-CimInstance Win32_VideoController)
          [ordered]@{
            session = $session
            explorer = $explorer.Count
            audioEndpoints = @($endpoints | ForEach-Object Name)
            graphics = @($graphics | ForEach-Object Name)
          } | ConvertTo-Json -Depth 3
      - name: Download the verified MSVC installers for this candidate
        uses: actions/download-artifact@v4
        with:
          name: voiceless-windows-x64-candidates
          run-id: '45683768636'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidates
      - name: Install both packages and reopen the original window from the named tray command
        run: python -B scripts/release/windows/accept.py "$env:RUNNER_TEMP/candidates"
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Select the release Rust toolchain
        run: rustup default 1.99.1-x86_64-pc-windows-msvc
      - name: Build the embedded console for the Windows tests
        run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund && npm --prefix frontend run build
      - name: Run the native history migration and concurrent open tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --test history_store
