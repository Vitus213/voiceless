name: Windows x64 installer acceptance

on:
  workflow_dispatch:
  push:
    branches: ['ci/windows-candidate/**']

permissions:
  contents: read

jobs:
  installers:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the release Rust toolchain
        run: rustup default 1.99.1-x86_64-pc-windows-msvc
      - name: Build core and desktop setup executables
        id: build
        run: python scripts/release/windows/package.py "$env:RUNNER_TEMP/candidates"
      - name: Exercise shortcut, hotplug, focus and integrity contracts
        run: cargo test --locked --manifest-path rust/Cargo.toml --lib desktop::native::contract::windows
      - name: Exercise Windows doctor and console audio selection
        run: cargo test --locked --manifest-path rust/Cargo.toml --test desktop_contract windows
      - name: Exercise model paths, history migration and concurrent first opens
        run: cargo test --locked --manifest-path rust/Cargo.toml --test model_manager --test history_store
      - name: Install both packages, transcribe offline and reopen the desktop window
        run: python -B scripts/release/windows/accept.py "$env:RUNNER_TEMP/candidates"
      - name: Keep the two MSVC installer candidates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: voiceless-windows-x64-candidates
          path: ${{ runner.temp }}/candidates/voiceless-*-v*-windows-x64.exe
          if-no-files-found: error
          compression-level: 0
      - name: Check guarded Unicode delivery in two native editor windows
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --locked --manifest-path rust/Cargo.toml --lib desktop::native::interactive::windows_delivers_unicode_to_the_original_editor_only -- --ignored --exact
      - name: Check WASAPI device discovery and refusal of a missing meeting input
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --locked --manifest-path rust/Cargo.toml --test capture_workflows native_meeting::catalog_resolves_host_ids_and_rejects_a_missing_selection_before_recording -- --exact
      - name: Exercise microphone, loopback, device loss and consent on disposable WASAPI endpoints
        run: |
          ./scripts/release/windows/lines.ps1
          python -m pip install sounddevice==0.5.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u -B scripts/release/windows/meeting.py "$env:RUNNER_TEMP/candidates"
