name: Core and desktop installers without WebView2
on:
  workflow_dispatch:
  push:
    branches: ['ci/windows-candidate/core-without-webview-0.2.0']
permissions:
  contents: read
  actions: read
jobs:
  server-core:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the release Rust toolchain
        run: rustup default 1.99.1-x86_64-pc-windows-msvc
      - name: Build the two static CRT candidates
        id: build
        run: python scripts/release/windows/package.py "$env:RUNNER_TEMP/candidates"
      - uses: actions/upload-artifact@v4
        with:
          name: voiceless-windows-static-crt-candidates
          path: ${{ runner.temp }}/candidates/voiceless-*-v*-windows-x64.exe
          if-no-files-found: error
          compression-level: 0
      - name: Install the exact candidates in a stock Windows container
        shell: pwsh
        run: |
          $candidates = Join-Path $env:RUNNER_TEMP 'candidates'
          Copy-Item scripts/release/windows/clean-install.ps1 $candidates
          @'
          FROM mcr.microsoft.com/windows/servercore:ltsc2022
          COPY . C:/proof/
          USER ContainerUser
          '@ | docker build --tag voiceless-dependency-check --file - $candidates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker image inspect mcr.microsoft.com/windows/servercore:ltsc2022 --format '{{.Id}} {{.OsVersion}}'
          $version = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          docker run --rm --network none voiceless-dependency-check powershell.exe -NoProfile -NonInteractive -File C:/proof/clean-install.ps1 $version
          exit $LASTEXITCODE
      - name: Verify offline CPU recognition and reopen the desktop window on the GUI host
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -B scripts/release/windows/accept.py "$env:RUNNER_TEMP/candidates"
