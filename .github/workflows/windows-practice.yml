name: Installed Windows typing settings

on:
  workflow_dispatch:
  push:
    branches: ['ci/windows-ui/native-typing-0.2.0']

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Build the release candidates
        run: |
          rustup default 1.99.1-x86_64-pc-windows-msvc
          python -B scripts/release/windows/package.py "$env:RUNNER_TEMP/candidates"
      - uses: actions/upload-artifact@v4
        with:
          name: voiceless-windows-x64-typing-candidates
          path: ${{ runner.temp }}/candidates/*.exe
          if-no-files-found: error
          compression-level: 0
      - name: Open installed typing settings in the native WebView2 window and save both choices
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install sounddevice==0.5.3 playwright==1.65.2
          python -u -B scripts/release/windows/typing-settings.py "$env:RUNNER_TEMP/candidates"
      - name: Keep the evidence of this guest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceless-windows-typing-evidence
          path: ${{ runner.temp }}/typing-evidence
          if-no-files-found: ignore
