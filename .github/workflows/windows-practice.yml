name: Installed Windows shortcut conflict and recovery

on:
  workflow_dispatch:
  push:
    branches: ['ci/windows-candidate/shortcut-conflict-0.2.0']

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45747948970
          name: voiceless-windows-static-crt-candidates
          path: ${{ runner.temp }}/candidates
      - name: Hold a competing chord, apply it from the installed settings page, then release and retry
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install sounddevice==0.5.3 playwright==1.65.2
          python -u -B scripts/release/windows/shortcut-conflict.py "$env:RUNNER_TEMP/candidates"
      - name: Keep the evidence of this guest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceless-windows-shortcut-evidence
          path: ${{ runner.temp }}/shortcut-evidence
          if-no-files-found: warn
