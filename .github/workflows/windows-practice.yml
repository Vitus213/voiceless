name: Installed Windows desktop setup feedback

on:
  workflow_dispatch:
  push:
    branches: ['ci/windows-candidate/setup-feedback-0.2.0']

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the runner's desktop, audio endpoints and graphics adapter
        run: |
          $session = (Get-Process -Id $PID).SessionId
          $explorer = @(Get-Process -Name explorer -ErrorAction SilentlyContinue | Where-Object SessionId -eq $session)
          $endpoints = @(Get-CimInstance Win32_PnPEntity -Filter "PNPClass = 'AudioEndpoint'" | Where-Object Present)
          $graphics = @(Get-CimInstance Win32_VideoController)
          [ordered]@{
            session = $session
            explorer = $explorer.Count
            audioEndpoints = @($endpoints | ForEach-Object Name)
            graphics = @($graphics | ForEach-Object Name)
          } | ConvertTo-Json -Depth 3
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Select the release Rust toolchain
        run: rustup default 1.99.1-x86_64-pc-windows-msvc
      - name: Build the CLI and desktop installers with the updated console
        run: python scripts/release/windows/package.py "$env:RUNNER_TEMP/candidates"
      - uses: actions/upload-artifact@v4
        with:
          name: voiceless-windows-x64-candidates
          path: ${{ runner.temp }}/candidates/voiceless-*-v*-windows-x64.exe
          if-no-files-found: error
          compression-level: 0
      - name: Set up two independent WASAPI endpoint pairs on the disposable guest
        run: ./scripts/release/windows/lines.ps1
      - name: Install the audio and interface automation tools
        run: python -m pip install sounddevice==0.5.3 playwright==1.65.2
      - name: First run of the installed desktop, its practice page, the hotkey registration and guarded delivery
        env:
          PYTHONUTF8: '1'
        run: python -u -B scripts/release/windows/practice.py "$env:RUNNER_TEMP/candidates"
      - name: Keep the evidence of this guest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceless-windows-practice-evidence
          path: ${{ runner.temp }}/practice-evidence
          if-no-files-found: ignore
