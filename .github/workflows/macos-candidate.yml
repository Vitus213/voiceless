name: Installed macOS unattended system-audio dialog

on:
  workflow_dispatch:
  push:
    branches: ['ci/macos-candidate/consent-0.2.0']

permissions:
  contents: read
  actions: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  candidate:
    name: Leave the system's dialog unanswered for the first dual-track meeting of the installed CLI
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the guest's session, privacy permissions, audio endpoints and signing identities
        run: bash scripts/release/macos/guest.sh
      - name: Install the audio signal generator
        run: python3 -m pip install sounddevice==0.5.3
      - name: Set up two test-owned loopback endpoints on the disposable guest
        run: bash scripts/release/macos/lines.sh
      # Fixture-only changes can rerun against the same DMGs built with the consent fix.
      - uses: actions/setup-node@v6
        if: ${{ !contains(github.event.head_commit.message, '[no build]') }}
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Build the candidate images with the release toolchain
        if: ${{ !contains(github.event.head_commit.message, '[no build]') }}
        run: |
          rustup default 1.99.1-aarch64-apple-darwin
          python3 -B scripts/release/macos/package.py "$RUNNER_TEMP/candidates"
      - name: Reuse the images built with the consent fix
        if: ${{ contains(github.event.head_commit.message, '[no build]') }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45703453204
          name: voiceless-macos-arm64-unanswered-candidates
          path: ${{ runner.temp }}/candidates
      - name: Keep the two images
        if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[no build]') }}
        uses: actions/upload-artifact@v4
        with:
          name: voiceless-macos-arm64-unanswered-candidates
          path: ${{ runner.temp }}/candidates/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Install the CLI and leave the system's dialog unanswered for its first dual-track meeting
        run: |
          set -eu
          root=$(mktemp -d "$RUNNER_TEMP/voiceless-consent.XXXXXXXX")
          mkdir -p "$root/volume" "$root/home" "$RUNNER_TEMP/evidence"
          image=$(ls "$RUNNER_TEMP"/candidates/voiceless-cli-v*-macos-arm64.dmg)
          shasum -a 256 "$image" | tee "$RUNNER_TEMP/evidence/image.txt"
          hdiutil attach -nobrowse -noautoopen -readonly -mountpoint "$root/volume" "$image"
          trap 'hdiutil detach "$root/volume"' EXIT
          HOME="$root/home" "$root/volume/install-cli.command"
          python3 -u -B scripts/release/macos/system-audio-consent.py "$root" "$RUNNER_TEMP/evidence"
      - name: Keep the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: voiceless-macos-system-audio-unanswered
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 14
