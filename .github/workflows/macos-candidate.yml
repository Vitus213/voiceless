name: Installed macOS meeting recovery

on:
  workflow_dispatch:
  push:
    branches: ['ci/macos-candidate/recovery-0.2.0']

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    name: Recover committed audio after a restart and a disconnected microphone
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45691666337
          name: voiceless-macos-arm64-candidates
          path: ${{ runner.temp }}/candidates
      - name: Install the audio signal generator
        run: python3 -m pip install sounddevice==0.5.3
      - name: Set up two test-owned loopback endpoints on the disposable guest
        run: bash scripts/release/macos/lines.sh
      - name: Install the CLI and exercise recovery on the preauthorized test microphone
        run: |
          set -eu
          root=$(mktemp -d "$RUNNER_TEMP/voiceless-recovery.XXXXXXXX")
          mkdir -p "$root/volume" "$root/home"
          hdiutil attach -nobrowse -noautoopen -readonly -mountpoint "$root/volume" "$RUNNER_TEMP/candidates/voiceless-cli-v0.2.0-macos-arm64.dmg"
          trap 'hdiutil detach "$root/volume"' EXIT
          HOME="$root/home" "$root/volume/install-cli.command"
          python3 -u -B scripts/release/macos/microphone-recovery.py "$root" "$RUNNER_TEMP/evidence"
      - name: Keep the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: voiceless-macos-microphone-recovery
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 14
