name: Installed macOS first phrase

on:
  workflow_dispatch:
  push:
    branches: ['ci/macos-candidate/installed-practice-0.2.0']

permissions:
  contents: read

  actions: read

jobs:
  candidate:
    name: Use the installed desktop window and save the practice result in TextEdit
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45694716105
          name: voiceless-macos-arm64-textedit-candidates
          path: ${{ runner.temp }}/candidates
      - name: Install the audio signal generator
        run: python3 -m pip install sounddevice==0.5.3
      - name: Set up two test-owned loopback endpoints on the disposable guest
        run: bash scripts/release/macos/lines.sh
      - name: Install the desktop image and operate its WKWebView
        run: |
          set -eu
          root=$(mktemp -d "$RUNNER_TEMP/voiceless-ui.XXXXXXXX")
          mkdir "$root/volume"
          hdiutil attach -readonly -noautoopen -nobrowse -mountpoint "$root/volume" "$RUNNER_TEMP/candidates/voiceless-desktop-v0.2.0-macos-arm64.dmg"
          ditto "$root/volume/Voiceless.app" "$root/Voiceless.app"
          hdiutil detach "$root/volume"
          xcrun clang -fobjc-arc scripts/release/macos/practice-controls.m -framework AppKit -framework ApplicationServices -o "$root/practice-controls"
          python3 -u -B scripts/release/macos/desktop-practice.py "$root" "$RUNNER_TEMP/evidence"
      - name: Keep the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: voiceless-macos-installed-practice
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 14
