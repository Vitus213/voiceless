# Voiceless streaming overlay sizing.
# The pill width grows with the live transcript from MIN_WIDTH_PX up to
# MAX_WIDTH_PX; beyond that the text scrolls (oldest characters slide out).
MAX_WIDTH_PX=720
# Visible text is a sliding window over the live transcript: once the text
# exceeds MAX_CHARS, only the newest MAX_CHARS characters are shown.
MAX_CHARS=20
MIN_WIDTH_PX=170
# Estimated horizontal pixels per CJK character at the overlay font size.
CHAR_PX=17
# Fixed pill height and bottom offset are in eww.yuck.
